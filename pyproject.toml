[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semif-phase1"
version = "0.1.0"
description = "Open baselines for runtime-defined semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
  "torch",
  "transformers",
  "accelerate",
  "safetensors",
  "huggingface-hub",
  "tokenizers",
  "numpy",
  "sentencepiece",
  "protobuf",
]

[project.scripts]
semif-score = "semif_phase1.cli:main"

[project.optional-dependencies]
test = ["pytest"]
mlx = [
  "mlx; sys_platform >= 'darwin' and platform_machine >= 'arm64'",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@a63e24c389382619eb6d9af656e3b46024be217a ; sys_platform >= 'darwin' and platform_machine >= 'arm64'",
]
llamacpp = ["llama-cpp-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "webgpu-demo"]
